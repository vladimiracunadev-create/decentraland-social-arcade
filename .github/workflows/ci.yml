name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad · Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Validar repositorio
        run: pnpm check
      - name: Compilar escena Decentraland
        run: pnpm build
      - name: Conservar bundle verificable
        uses: actions/upload-artifact@v6
        with:
          name: escena-decentraland
          path: bin/
          if-no-files-found: error
          retention-days: 7
