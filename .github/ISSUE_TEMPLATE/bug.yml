name: Error en la escena
description: Reporta un fallo reproducible en Decentraland Explorer o en el proyecto.
title: 'fix: '
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Explica qué ocurrió y qué esperabas.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproducción
      description: Incluye pasos, posición aproximada del avatar y acción realizada.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      placeholder: Creator Hub, Explorer, sistema operativo y versión de Node
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Capturas, vídeo o registros sin secretos ni datos personales.
